# VPS: docker compose up -d --build
# Бот ходит к MAX и GigaChat сам (long polling) — портов наружу нет, у Redis тоже.
services:
  bot:
    build: .
    image: max-homework-ai-bot
    container_name: homework-bot
    restart: unless-stopped
    # SIGTERM: раннер дообрабатывает уже полученный батч (альбом — до пары минут) и выходит
    stop_grace_period: 150s
    env_file: .env
    environment:
      # состояние диалога (FSM) — в Redis: рестарт бота не сбрасывает разборы тьютора
      REDIS_URL: redis://redis:6379/0
      # лог бота на томе var/ (ротация 5 МБ × 3): docker logs пропадают при пересборке
      LOG_PATH: var/bot.log
      # профили, согласия, приглашения; пароль — из .env (python -m hwcheck keys)
      DATABASE_URL: postgresql://homework:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}@postgres:5432/homework
      # OCR для языков (контейнер homework-ocr, профиль ocr). Пусто, пока контейнер не запущен:
      # клиент создаётся только при заданном OCR_URL, модуль math OCR не использует. Включение —
      # OCR_URL=http://ocr:8080 в .env вместе с запуском сервиса ocr (этап «русский»)
      OCR_URL: ${OCR_URL:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Контейнер работает от uid 1000: перед первым запуском на хосте
    #   mkdir -p var .cache && chown -R 1000:1000 var .cache
    # иначе Docker создаст каталоги от root и бот не сможет писать marker/журнал/кэш
    volumes:
      # events.jsonl (метрика/антифрод), max_marker.txt, photos/ (TTL 30 дней),
      # kb_photos/ — страницы учебников базы знаний (TTL 365 дней, данных ребёнка нет)
      - ./var:/app/var
      - ./.cache:/app/.cache    # кэш ответов солвера — не перегонять одни и те же задания
    deploy:
      resources:
        limits:
          # +~170 МБ: словарь русского (spylls) грузится в память при старте, до polling
          memory: 1g
    # marker пишется после каждого GET /updates (long poll ≤30 с); обработка альбома
    # из 4 фото может занять минуту-две — потому окно 5 минут
    healthcheck:
      test: ["CMD-SHELL", "find /app/var/max_marker.txt -mmin -5 | grep -q ."]
      interval: 60s
      timeout: 5s
      start_period: 120s
      retries: 3

  redis:
    image: redis:8-alpine
    container_name: homework-redis
    restart: unless-stopped
    # AOF — диалоги переживают и рестарт самого Redis; ключи fsm:* с TTL 24 ч,
    # потолок памяти — VPS общий с другими проектами
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl"]
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: homework-postgres
    restart: unless-stopped
    # портов наружу нет: база доступна только боту в сети compose
    environment:
      POSTGRES_USER: homework
      POSTGRES_DB: homework
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homework -d homework"]
      interval: 10s
      timeout: 3s
      retries: 5

  # OCR-сервис для языков (посимвольное распознавание рукописи, спецификация каркаса §8):
  # не стартует по умолчанию, только явно (docker compose --profile ocr up -d ocr)
  ocr:
    build:
      context: .
      dockerfile: ocrsvc/Dockerfile
    image: max-homework-ai-ocr
    container_name: homework-ocr
    # сбой загрузки весов/движка (нет файлов, битый конфиг, OOM) не должен крутить контейнер
    # вечно на общем VPS — ~1,4 ГБ весов заново на каждую попытку; server.py падает ненулевым
    # кодом при неудачной инициализации движка (см. main())
    restart: on-failure:3
    profiles: ["ocr"]            # стартует только явно: docker compose --profile ocr up -d ocr
    environment:
      OCR_ENGINE: ${OCR_ENGINE:-readingpipeline}
    deploy:
      resources:
        limits:
          # спайк памяти 17.09 (docs/research/2026-09-17-readingpipeline-memory.md): пик 1,46 ГБ
          # на реальных фото (без torch, арена/mem-pattern onnxruntime выключены) + запас
          memory: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 120s
    # без портов наружу: бот ходит по compose-сети как к http://ocr:8080

  # ежедневный pg_dump в var/backups, хранение 7 дней (спецификация онбординга §7)
  pgbackup:
    image: postgres:17-alpine
    container_name: homework-pgbackup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: homework
      PGDATABASE: homework
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # дампы с данными детей — только владельцу: хост общий с другими проектами (ревью)
        umask 077
        while true; do
          pg_dump --format=custom --file=/backups/homework-$$(date -u +%F).dump \
            && find /backups -name 'homework-*.dump' -mtime +7 -delete
          sleep 86400
        done
    volumes:
      - ./var/backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  redis-data:
  postgres-data:
