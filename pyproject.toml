[project]
name = "hwcheck"
version = "0.1.0"
description = "AI-проверка домашней работы в мессенджере MAX (Cloud.ru Evolution + GigaChat API)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "certifi>=2024.2.2",
    "cryptography>=50.0.1",
    "gigachat>=0.1.42",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "redis>=5.2",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "fakeredis>=2.38.0",
    "asyncpg-stubs>=0.31.3",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hwcheck"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "ocrsvc"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
# ocrsvc/ — отдельный пакет в корне репозитория (свой образ), но типы проверяем вместе с ботом
mypy_path = "src"
packages = ["hwcheck", "ocrsvc"]

[[tool.mypy.overrides]]
module = ["gigachat.*", "sympy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "ocrpipeline.*", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# пакет ocrsvc/ лежит в корне репозитория (не в src/hwcheck): свои тяжёлые зависимости и свой образ
pythonpath = ["."]
