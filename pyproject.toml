[project]
name = "hwcheck"
version = "0.1.0"
description = "AI-проверка домашней работы в мессенджере MAX (Cloud.ru Evolution + GigaChat API)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gigachat>=0.1.42",
    "pillow>=12.3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hwcheck"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["hwcheck"]

[[tool.mypy.overrides]]
module = "gigachat.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
